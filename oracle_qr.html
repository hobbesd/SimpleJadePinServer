<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Jade PIN Server &middot; Oracle QR</title>
        <link rel="apple-touch-icon" href="apple-touch-icon.png">
        <link rel="icon" type="image/png" href="favicon.png">
        <script src="qrcode.js" defer></script>
        <script src="jade-codec.js" defer></script>
        <script src="oracle_qr.js" defer></script>
        <style>
            :root {
                --bg: #f4f6f5;
                --card: #ffffff;
                --border: #e4e9e7;
                --accent: #0a8a5f;
                --accent-soft: #e2f4ec;
                --text: #17211d;
                --muted: #6d7c76;
                --mono: ui-monospace, "SF Mono", Menlo, monospace;
            }
            * { box-sizing: border-box; }
            html { background: var(--bg); }
            body {
                margin: 0 auto;
                max-width: 480px;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                padding: 24px 16px 32px;
                min-height: 100vh;
            }
            header { margin-bottom: 20px; }
            h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.03em; }
            .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
            .sub a { color: var(--accent); font-weight: 600; text-decoration: none; }
            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 20px;
                padding: 20px 18px;
                margin-bottom: 14px;
                box-shadow: 0 1px 3px rgba(23,33,29,.05), 0 8px 24px rgba(23,33,29,.04);
            }
            label {
                display: block;
                font-size: 12px; font-weight: 700; letter-spacing: .08em;
                text-transform: uppercase; color: var(--accent);
                margin: 14px 0 4px;
            }
            label:first-child { margin-top: 0; }
            input[type=text] {
                width: 100%; padding: 11px 13px;
                border: 1px solid var(--border); border-radius: 12px;
                font-family: var(--mono); font-size: 12.5px;
                color: var(--text); background: #f7faf9;
            }
            .btn {
                display: block; width: 100%;
                margin-top: 16px; padding: 15px;
                border: 0; border-radius: 14px;
                background: var(--accent);
                color: #fff; font-size: 16px; font-weight: 700;
                font-family: inherit; cursor: pointer;
                box-shadow: 0 4px 14px rgba(10,138,95,.25);
            }
            .qr-tile {
                max-width: 270px; margin: 16px auto 0;
                border: 1px solid var(--border);
                border-radius: 16px;
                padding: 16px; background: #fff;
            }
            .qr-tile[hidden] { display: none; }
            #generated_qrcode img { width: 100%; height: auto; display: block; image-rendering: pixelated; }
        </style>
    </head>
    <body>
        <header>
            <h1>Oracle QR</h1>
            <div class="sub">Generate the update_pinserver QR for your Jade &middot; <a href="./">&larr; back to PIN server</a></div>
        </header>

        <div class="card">
            <label for="urla">urlA</label>
            <input type="text" id="urla" placeholder="http://taf3nizjnxuqxlg64t7ldtejs7qyevlwiuno4tjym4dtuhixyzhi27ad.onion:8096" size="64" value="http://127.0.0.1:4443" />
            <label for="urlb">urlB</label>
            <input type="text" id="urlb" placeholder="http://maia:8096" size="64" />
            <label for="pubkey">pubkey (hex)</label>
            <input type="text" id="pubkey" placeholder="023447839124dc14d6007774399f4dc10ab3596a70c8d75dd9bae9998453784877" size="66" value="{STATIC_SERVER_PUBLIC_KEY}" />
            <button class="btn" id="btn_generate">Generate QR code</button>
            <div class="qr-tile" id="qr_tile" hidden><div id="generated_qrcode"></div></div>
        </div>
    </body>
</html>
